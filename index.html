<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ZIME BOT CONTROL - Ultimate Command Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', 'Courier New', 'Monaco', monospace;
            min-height: 100vh;
            padding: 20px;
        }

        .scroll-container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(100, 150, 255, 0.5);
        }

        .header p {
            color: #8892b0;
            margin-top: 10px;
            font-size: 14px;
        }

        .card {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .card:hover {
            border-color: rgba(100, 150, 255, 0.3);
            box-shadow: 0 0 20px rgba(100, 150, 255, 0.1);
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #e6f1ff;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 1px;
        }

        .bot-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .bot-item {
            background: rgba(20, 20, 40, 0.8);
            padding: 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .bot-item:hover {
            background: rgba(60, 80, 120, 0.6);
            transform: translateY(-2px);
        }

        .bot-item.selected {
            background: linear-gradient(135deg, #2c3e66, #1a2a44);
            border: 1px solid #5a7d9a;
            box-shadow: 0 0 12px rgba(90, 125, 154, 0.3);
        }

        .bot-name {
            color: #ccd6f6;
            font-weight: 500;
            font-size: 14px;
        }

        .bot-status {
            font-size: 11px;
            color: #64ffda;
            margin-top: 6px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #a8b2d1;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 14px;
            font-family: monospace;
            font-size: 13px;
            transition: all 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #5a7d9a;
            box-shadow: 0 0 10px rgba(90, 125, 154, 0.3);
        }

        button {
            background: linear-gradient(135deg, #2c3e66, #1a2a44);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            font-family: inherit;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg, #3a5080, #2a3a60);
        }

        button.secondary {
            background: rgba(100, 100, 120, 0.4);
        }

        button.danger {
            background: rgba(150, 60, 60, 0.6);
        }

        button.success {
            background: rgba(60, 120, 80, 0.6);
        }

        .flex-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .flex-row button {
            flex: 1;
        }

        .log-area {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 16px;
            padding: 16px;
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: #94a3b8;
        }

        .user-list-area {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            padding: 12px;
            max-height: 250px;
            overflow-y: auto;
        }

        .user-item {
            padding: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            color: #cbd5e1;
            cursor: pointer;
        }

        .user-item:hover {
            background: rgba(100, 150, 255, 0.2);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #64ffda;
        }

        .stat-label {
            font-size: 11px;
            color: #8892b0;
        }

        .schedule-item {
            background: rgba(20, 20, 40, 0.6);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 12px;
        }

        .image-preview {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 12px;
            display: none;
        }

        .single-user-panel {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            display: none;
        }

        .scroll-hint {
            text-align: center;
            padding: 15px;
            color: #5a7d9a;
            font-size: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 10px;
        }

        .scroll-hint::before {
            content: "⬇️  SCROLL DOWN FOR MORE FEATURES  ⬇️";
            letter-spacing: 2px;
        }

        .auto-response-card {
            background: rgba(30, 40, 60, 0.4);
            border-left: 3px solid #64ffda;
        }
    </style>
</head>
<body>

<div class="scroll-container">
    <div class="header">
        <h1>ZIME BOT CONTROL</h1>
        <p>Ultimate Bot Management | Broadcast | Schedule | Export</p>
    </div>

    <!-- CARD 1: BOT SELECTOR -->
    <div class="card">
        <div class="card-title">BOT SELECTOR</div>
        <div class="bot-grid" id="botListContainer"></div>
        
        <div class="input-group" style="margin-top: 20px;">
            <label>BOT TOKEN (from @BotFather)</label>
            <input type="password" id="manualToken" placeholder="Enter your bot token">
            <button id="saveTokenBtn" style="margin-top: 10px;">Save Token for This Bot</button>
        </div>
    </div>

    <!-- CARD 2: AUTO RESPONSE SETTINGS (NEW) -->
    <div class="card auto-response-card">
        <div class="card-title">🤖 AUTO RESPONSE FOR /start</div>
        <div class="input-group">
            <label>Welcome Message (English)</label>
            <textarea id="welcomeMessage" rows="3">Hello! Welcome to ZimeMajesty Bot.</textarea>
        </div>
        <div class="input-group">
            <label>Button Text</label>
            <input type="text" id="buttonText" value="Visit Our Shop">
        </div>
        <div class="input-group">
            <label>Button URL</label>
            <input type="text" id="buttonUrl" value="https://t.me/+nID0U-gMoQ02OGJl">
        </div>
        <button id="saveAutoResponseBtn">Save Auto Response Settings</button>
        <button id="testAutoResponseBtn" class="secondary" style="margin-top: 10px;">Test Send to Yourself</button>
    </div>

    <!-- CARD 3: USER DATABASE -->
    <div class="card">
        <div class="card-title">USER DATABASE</div>
        <div id="userStats" class="stats">
            <div class="stat-box">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="lastSync">-</div>
                <div class="stat-label">Last Sync</div>
            </div>
        </div>
        <div class="flex-row">
            <button id="syncUsersBtn">Sync Users (/start)</button>
            <button id="exportCsvBtn" class="success">Export to CSV</button>
        </div>
        <div id="userListArea" class="user-list-area" style="margin-top: 15px;">
            <div style="color: #8892b0; text-align: center;">No data yet, click sync</div>
        </div>
    </div>

    <!-- CARD 4: BROADCAST MESSAGE -->
    <div class="card">
        <div class="card-title">BROADCAST MESSAGE</div>
        <div class="input-group">
            <label>Message to All Users (HTML supported)</label>
            <textarea id="broadcastMessage" rows="3" placeholder="Write your broadcast message here..."></textarea>
        </div>
        <div class="input-group">
            <label>Send Image (URL or Upload)</label>
            <input type="text" id="imageUrl" placeholder="https://example.com/image.jpg">
            <input type="file" id="imageFile" accept="image/*" style="margin-top: 8px;">
            <img id="imagePreview" class="image-preview" alt="Preview">
        </div>
        <button id="sendBroadcastBtn">Send to All Users</button>
    </div>

    <!-- CARD 5: SCHEDULED BROADCAST -->
    <div class="card">
        <div class="card-title">SCHEDULED BROADCAST</div>
        <div class="input-group">
            <label>Date & Time</label>
            <input type="datetime-local" id="scheduleTime">
        </div>
        <div class="input-group">
            <label>Scheduled Message</label>
            <textarea id="scheduleMessage" rows="2" placeholder="Message to be sent automatically..."></textarea>
        </div>
        <div class="flex-row">
            <button id="addScheduleBtn">Add Schedule</button>
            <button id="viewSchedulesBtn" class="secondary">View Schedules</button>
        </div>
        <div id="scheduleList" style="margin-top: 15px; max-height: 200px; overflow-y: auto;"></div>
    </div>

    <!-- CARD 6: SINGLE USER MESSAGE -->
    <div class="card">
        <div class="card-title">SEND TO SPECIFIC USER</div>
        <div id="singleUserPanel" class="single-user-panel">
            <input type="text" id="targetUserId" placeholder="User ID" style="margin-bottom: 8px;">
            <textarea id="singleMessage" rows="2" placeholder="Specific message..."></textarea>
            <button id="executeSingleBtn" style="margin-top: 8px;">Send Now</button>
        </div>
        <button id="showSinglePanelBtn" class="secondary">Show Single User Panel</button>
        <button id="clearDataBtn" class="danger" style="margin-top: 10px;">Reset This Bot Data</button>
    </div>

    <!-- CARD 7: ACTIVITY LOG -->
    <div class="card">
        <div class="card-title">ACTIVITY LOG</div>
        <div id="logArea" class="log-area">
            [System] ZIME Bot Control Ready
        </div>
    </div>

    <div class="scroll-hint"></div>
</div>

<script>
    // ======================= DATA BOT (10 Username) =======================
    const BOTS = [
        { id: 1, name: "AlphaGuardBot", token: null },
        { id: 2, name: "NeuralScanBot", token: null },
        { id: 3, name: "PhantomXBot", token: null },
        { id: 4, name: "AegisCoreBot", token: null },
        { id: 5, name: "QuantumLinkBot", token: null },
        { id: 6, name: "StealthModeBot", token: null },
        { id: 7, name: "EchoCommandBot", token: null },
        { id: 8, name: "FrostByteBot", token: null },
        { id: 9, name: "RavenNetBot", token: null },
        { id: 10, name: "VortexCtrlBot", token: null }
    ];

    let currentBotId = null;
    let currentUsers = [];
    let schedules = [];

    // Default auto response settings
    let autoResponse = {
        message: "Hello! Welcome to ZimeMajesty Bot.\n\nPlease visit our shop:",
        buttonText: "Visit Our Shop",
        buttonUrl: "https://t.me/+nID0U-gMoQ02OGJl"
    };

    function loadStorage() {
        for (let bot of BOTS) {
            const savedToken = localStorage.getItem(`bot_token_${bot.name}`);
            if (savedToken) bot.token = savedToken;
            
            if (bot.name === getCurrentBotName()) {
                const savedUsers = localStorage.getItem(`bot_users_${bot.name}`);
                if (savedUsers) currentUsers = JSON.parse(savedUsers);
            }
        }
        
        const lastBot = localStorage.getItem('current_bot_id');
        if (lastBot) currentBotId = parseInt(lastBot);
        else if (BOTS.length > 0) currentBotId = BOTS[0].id;
        
        const savedSchedules = localStorage.getItem('all_schedules');
        if (savedSchedules) schedules = JSON.parse(savedSchedules);
        
        // Load auto response settings
        const savedAutoResponse = localStorage.getItem('auto_response_settings');
        if (savedAutoResponse) autoResponse = JSON.parse(savedAutoResponse);
        
        // Populate auto response form
        document.getElementById('welcomeMessage').value = autoResponse.message;
        document.getElementById('buttonText').value = autoResponse.buttonText;
        document.getElementById('buttonUrl').value = autoResponse.buttonUrl;
        
        renderBotList();
        updateUserDisplay();
        startScheduleChecker();
        startWebhookChecker();
    }

    function getCurrentBotName() {
        const bot = BOTS.find(b => b.id === currentBotId);
        return bot ? bot.name : null;
    }

    function saveCurrentBotToken(token) {
        const bot = BOTS.find(b => b.id === currentBotId);
        if (bot) {
            bot.token = token;
            localStorage.setItem(`bot_token_${bot.name}`, token);
            addLog(`Token for ${bot.name} saved`, "success");
            // After saving token, setup webhook for auto response
            setupAutoResponseWebhook(token);
        }
    }

    function saveUsersToStorage(users) {
        const botName = getCurrentBotName();
        if (botName) {
            localStorage.setItem(`bot_users_${botName}`, JSON.stringify(users));
            currentUsers = users;
            updateUserDisplay();
        }
    }

    function updateUserDisplay() {
        const total = currentUsers.length;
        document.getElementById('totalUsers').innerText = total;
        const lastSyncTime = localStorage.getItem(`last_sync_${getCurrentBotName()}`) || '-';
        document.getElementById('lastSync').innerText = lastSyncTime;
        
        const container = document.getElementById('userListArea');
        if (total === 0) {
            container.innerHTML = '<div style="color: #8892b0; text-align: center;">No data yet, click sync</div>';
            return;
        }
        
        let html = '';
        currentUsers.forEach(user => {
            html += `<div class="user-item" onclick="fillUserId('${user.id}')">ID: ${user.id} | ${user.name} | @${user.username}</div>`;
        });
        container.innerHTML = html;
    }

    window.fillUserId = function(userId) {
        document.getElementById('targetUserId').value = userId;
        document.getElementById('singleUserPanel').style.display = 'block';
        addLog(`User ID ${userId} ready for message`, "info");
    };

    function renderBotList() {
        const container = document.getElementById('botListContainer');
        container.innerHTML = '';
        for (let bot of BOTS) {
            const div = document.createElement('div');
            div.className = `bot-item ${currentBotId === bot.id ? 'selected' : ''}`;
            div.innerHTML = `
                <div class="bot-name">${bot.name}</div>
                <div class="bot-status">${bot.token ? 'Token saved' : 'No token'}</div>
            `;
            div.onclick = () => switchBot(bot.id);
            container.appendChild(div);
        }
        
        const currentBot = BOTS.find(b => b.id === currentBotId);
        if (currentBot && currentBot.token) {
            document.getElementById('manualToken').value = currentBot.token;
        } else {
            document.getElementById('manualToken').value = '';
        }
    }

    function switchBot(botId) {
        currentBotId = botId;
        localStorage.setItem('current_bot_id', botId);
        
        const botName = getCurrentBotName();
        const savedUsers = localStorage.getItem(`bot_users_${botName}`);
        currentUsers = savedUsers ? JSON.parse(savedUsers) : [];
        
        const bot = BOTS.find(b => b.id === botId);
        document.getElementById('manualToken').value = bot && bot.token ? bot.token : '';
        
        renderBotList();
        updateUserDisplay();
        addLog(`Switched to bot: ${botName}`, "info");
        
        // Setup webhook for new bot if token exists
        if (bot && bot.token) {
            setupAutoResponseWebhook(bot.token);
        }
    }

    async function callTelegram(method, token, params = {}) {
        const url = `https://api.telegram.org/bot${token}/${method}`;
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(params)
            });
            return await res.json();
        } catch(e) {
            addLog(`Network error: ${e.message}`, "error");
            return null;
        }
    }

    // ======================= AUTO RESPONSE WEBHOOK SETUP =======================
    async function setupAutoResponseWebhook(token) {
        if (!token) return;
        
        // First, delete old webhook
        await callTelegram('deleteWebhook', token, { drop_pending_updates: true });
        
        // We'll use getUpdates polling instead of webhook (works without public URL)
        addLog(`Auto response mode: polling active for /start`, "info");
    }

    // Polling for /start commands (alternative to webhook)
    let lastUpdateId = 0;
    async function checkForStartCommands() {
        const bot = BOTS.find(b => b.id === currentBotId);
        if (!bot || !bot.token) return;
        
        const result = await callTelegram('getUpdates', bot.token, { 
            offset: lastUpdateId + 1,
            timeout: 5,
            allowed_updates: ['message']
        });
        
        if (result && result.ok && result.result) {
            for (const update of result.result) {
                lastUpdateId = update.update_id;
                const msg = update.message;
                if (msg && msg.text === '/start' && msg.from) {
                             const chatId = msg.from.id;
                    await sendWelcomeMessage(bot.token, chatId);
                    addLog(`Auto response sent to ${msg.from.first_name} (${chatId})`, "success");
                }
            }
        }
    }

    async function sendWelcomeMessage(token, chatId) {
        const message = autoResponse.message;
        const buttonText = autoResponse.buttonText;
        const buttonUrl = autoResponse.buttonUrl;
        
        const inlineKeyboard = {
            inline_keyboard: [
                [{ text: buttonText, url: buttonUrl }]
            ]
        };
        
        const result = await callTelegram('sendMessage', token, {
            chat_id: chatId,
            text: message,
            reply_markup: JSON.stringify(inlineKeyboard),
            parse_mode: 'HTML'
        });
        
        return result && result.ok;
    }

    async function testAutoResponse() {
        const bot = BOTS.find(b => b.id === currentBotId);
        if (!bot || !bot.token) {
            addLog("Save bot token first", "error");
            return;
        }
        
        // Find current user's chat ID (first in list)
        if (currentUsers.length === 0) {
            addLog("No users found. Sync users first, then test.", "error");
            return;
        }
        
        const testUser = currentUsers[0];
        const success = await sendWelcomeMessage(bot.token, testUser.id);
        if (success) {
            addLog(`Test auto response sent to ${testUser.name}`, "success");
        } else {
            addLog(`Failed to send test message`, "error");
        }
    }

    function saveAutoResponseSettings() {
        autoResponse = {
            message: document.getElementById('welcomeMessage').value,
            buttonText: document.getElementById('buttonText').value,
            buttonUrl: document.getElementById('buttonUrl').value
        };
        localStorage.setItem('auto_response_settings', JSON.stringify(autoResponse));
        addLog("Auto response settings saved", "success");
    }

    // ======================= START POLLING =======================
    function startWebhookChecker() {
        setInterval(() => {
            checkForStartCommands();
        }, 2000); // Check every 2 seconds
    }

    // ======================= SYNC USERS =======================
    async function syncUsers() {
        const bot = BOTS.find(b => b.id === currentBotId);
        if (!bot || !bot.token) {
            addLog(`Token for ${bot.name} not saved yet.`, "error");
            return;
        }
        
        addLog(`Syncing users for ${bot.name}...`, "info");
        const result = await callTelegram('getUpdates', bot.token, { timeout: 1, allowed_updates: ['message'] });
        
        if (!result || !result.ok) {
            addLog(`Sync failed: ${result?.description || 'Invalid token'}`, "error");
            return;
        }
        
        const updates = result.result;
        const userMap = new Map();
        for (let update of updates) {
            const msg = update.message;
            if (msg && msg.from) {
                const from = msg.from;
                if (!userMap.has(from.id)) {
                    userMap.set(from.id, {
                        id: from.id,
                        name: `${from.first_name || ''} ${from.last_name || ''}`.trim() || from.username || 'No Name',
                        username: from.username || 'no_username'
                    });
                }
            }
        }
        
        const users = Array.from(userMap.values());
        saveUsersToStorage(users);
        const now = new Date().toLocaleString();
        localStorage.setItem(`last_sync_${bot.name}`, now);
        document.getElementById('lastSync').innerText = now;
        addLog(`Sync complete. Found ${users.length} users who used /start.`, "success");
    }

    function exportToCSV() {
        if (currentUsers.length === 0) {
            addLog("No user data to export.", "error");
            return;
        }
        
        let csvContent = "User ID,Name,Username\n";
        currentUsers.forEach(user => {
            csvContent += `${user.id},${user.name},${user.username}\n`;
        });
        
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute('download', `users_${getCurrentBotName()}_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        addLog(`CSV exported: ${currentUsers.length} users`, "success");
    }

    // Image handling
    document.getElementById('imageFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const imgUrl = event.target.result;
                document.getElementById('imageUrl').value = imgUrl;
                const preview = document.getElementById('imagePreview');
                preview.src = imgUrl;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    // ======================= BROADCAST =======================
    async function sendBroadcast() {
        const bot = BOTS.find(b => b.id === currentBotId);
        if (!bot || !bot.token) {
            addLog("Bot token not saved.", "error");
            return;
        }
        
        if (currentUsers.length === 0) {
            addLog("No users. Sync first.", "error");
            return;
        }
        
        const message = document.getElementById('broadcastMessage').value;
        const imageUrl = document.getElementById('imageUrl').value;
        
        if (!message.trim() && !imageUrl) {
            addLog("Message or image required.", "error");
            return;
        }
        
        addLog(`Broadcasting to ${currentUsers.length} users...`, "info");
        let success = 0, failed = 0;
        
        for (let user of currentUsers) {
            let result;
            if (imageUrl) {
                result = await callTelegram('sendPhoto', bot.token, {
                    chat_id: user.id,
                    photo: imageUrl,
                    caption: message,
                    parse_mode: 'HTML'
                });
                // Fallback to document if photo fails
                if (!result || !result.ok) {
                    result = await callTelegram('sendDocument', bot.token, {
                        chat_id: user.id,
                        document: imageUrl,
                        caption: message,
                        parse_mode: 'HTML'
                    });
                }
            } else {
                result = await callTelegram('sendMessage', bot.token, {
                    chat_id: user.id,
                    text: message,
                    parse_mode: 'HTML'
                });
            }
            if (result && result.ok) success++;
            else failed++;
            await new Promise(r => setTimeout(r, 60));
        }
        
        addLog(`Broadcast complete. Success: ${success}, Failed: ${failed}`, success > 0 ? "success" : "error");
    }

    // ======================= SCHEDULE FUNCTIONS =======================
    function addSchedule() {
        const scheduleTime = document.getElementById('scheduleTime').value;
        const message = document.getElementById('scheduleMessage').value;
        
        if (!scheduleTime || !message.trim()) {
            addLog("Fill time and message for schedule.", "error");
            return;
        }
        
        const schedule = {
            id: Date.now(),
            botId: currentBotId,
            botName: getCurrentBotName(),
            time: scheduleTime,
            message: message,
            executed: false
        };
        
        schedules.push(schedule);
        localStorage.setItem('all_schedules', JSON.stringify(schedules));
        addLog(`Schedule added: ${scheduleTime}`, "success");
        displaySchedules();
    }
    
    function displaySchedules() {
        const container = document.getElementById('scheduleList');
        const activeSchedules = schedules.filter(s => !s.executed);
        
        if (activeSchedules.length === 0) {
            container.innerHTML = '<div style="color: #8892b0; text-align: center;">No active schedules</div>';
            return;
        }
        
        let html = '';
        activeSchedules.forEach(s => {
            html += `
                <div class="schedule-item">
                    <strong>${s.botName}</strong><br>
                    Time: ${s.time}<br>
                    Message: ${s.message.substring(0, 50)}${s.message.length > 50 ? '...' : ''}<br>
                    <button onclick="deleteSchedule(${s.id})" style="margin-top: 8px; padding: 4px 12px; width: auto;">Delete</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }
    
    window.deleteSchedule = function(id) {
        schedules = schedules.filter(s => s.id !== id);
        localStorage.setItem('all_schedules', JSON.stringify(schedules));
        displaySchedules();
        addLog("Schedule deleted", "info");
    };
    
    function startScheduleChecker() {
        setInterval(async () => {
            const now = new Date();
            for (let schedule of schedules) {
                if (!schedule.executed) {
                    const scheduleDate = new Date(schedule.time);
                    if (scheduleDate <= now) {
                        schedule.executed = true;
                        localStorage.setItem('all_schedules', JSON.stringify(schedules));
                        
                        const bot = BOTS.find(b => b.name === schedule.botName);
                        if (bot && bot.token) {
                            const savedUsers = localStorage.getItem(`bot_users_${bot.name}`);
                            if (savedUsers) {
                                const users = JSON.parse(savedUsers);
                                addLog(`Executing schedule for ${schedule.botName} to ${users.length} users`, "info");
                                for (let user of users) {
                                    await callTelegram('sendMessage', bot.token, {
                                        chat_id: user.id,
                                        text: schedule.message,
                                        parse_mode: 'HTML'
                                    });
                                    await new Promise(r => setTimeout(r, 50));
                                }
                                addLog(`Schedule ${schedule.id} completed`, "success");
                            }
                        }
                        displaySchedules();
                    }
                }
            }
        }, 30000);
    }

    function addLog(msg, type = "info") {
        const logDiv = document.getElementById('logArea');
        const time = new Date().toLocaleTimeString();
        const prefix = type === "error" ? "ERROR" : type === "success" ? "OK" : "INFO";
        const color = type === "error" ? "#ff8888" : type === "success" ? "#88ff88" : "#aaffff";
        logDiv.innerHTML += `<div style="color: ${color}">[${time}] [${prefix}] ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    // ======================= EVENT LISTENERS =======================
    document.getElementById('saveTokenBtn').onclick = () => {
        const newToken = document.getElementById('manualToken').value.trim();
        if (newToken) {
            saveCurrentBotToken(newToken);
            addLog("Token saved.", "success");
        } else {
            addLog("Token cannot be empty.", "error");
        }
    };
    
    document.getElementById('syncUsersBtn').onclick = syncUsers;
    document.getElementById('exportCsvBtn').onclick = exportToCSV;
    document.getElementById('sendBroadcastBtn').onclick = sendBroadcast;
    document.getElementById('addScheduleBtn').onclick = addSchedule;
    document.getElementById('viewSchedulesBtn').onclick = displaySchedules;
    document.getElementById('showSinglePanelBtn').onclick = () => {
        const panel = document.getElementById('singleUserPanel');
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    };
    document.getElementById('clearDataBtn').onclick = () => {
        const botName = getCurrentBotName();
        if (botName && confirm(`Reset all data for ${botName}?`)) {
            localStorage.removeItem(`bot_users_${botName}`);
            localStorage.removeItem(`bot_token_${botName}`);
            currentUsers = [];
            const bot = BOTS.find(b => b.id === currentBotId);
            if (bot) bot.token = null;
            document.getElementById('manualToken').value = '';
            renderBotList();
            updateUserDisplay();
            addLog(`Bot data for ${botName} has been reset.`, "info");
        }
    };
    document.getElementById('executeSingleBtn').onclick = async () => {
        const userId = document.getElementById('targetUserId').value.trim();
        const msg = document.getElementById('singleMessage').value.trim();
        if (!userId || !msg) {
            addLog("User ID and message required.", "error");
            return;
        }
        const bot = BOTS.find(b => b.id === currentBotId);
        if (!bot || !bot.token) {
            addLog("Bot token not saved.", "error");
            return;
        }
        const result = await callTelegram('sendMessage', bot.token, {
            chat_id: userId,
            text: msg,
            parse_mode: 'HTML'
        });
        if (result && result.ok) addLog(`Message sent to user ${userId}`, "success");
        else addLog(`Failed to send to ${userId}`, "error");
    };
    
    // Auto response event listeners
    document.getElementById('saveAutoResponseBtn').onclick = saveAutoResponseSettings;
    document.getElementById('testAutoResponseBtn').onclick = testAutoResponse;
    
    // Inisialisasi
    loadStorage();
</script>
